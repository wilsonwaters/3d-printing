name: Build Skill Artifacts

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'scripts/build-adapters.py'
      - 'scripts/build-skill-zip.py'
      - '.claude-plugin/plugin.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build adapter files
        run: python scripts/build-adapters.py

      - name: Commit updated adapters
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild framework adapters'
          file_pattern: 'adapters/**'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read skill version
        id: version
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build installable skill zip
        run: python scripts/build-skill-zip.py

      - name: Publish skill zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 3d-print-designer v${{ steps.version.outputs.version }}
          body: |
            Installable skill archive for **Claude Desktop** and **claude.ai**.

            Download `3d-print-designer.zip` below, then in Claude go to
            **Customize → Skills → Create skill → Upload a skill** and select the zip.

            The `latest` release always points to the current `main`:
            https://github.com/wilsonwaters/3d-printing/releases/latest/download/3d-print-designer.zip
          make_latest: true
          files: dist/*.zip
          fail_on_unmatched_files: true
