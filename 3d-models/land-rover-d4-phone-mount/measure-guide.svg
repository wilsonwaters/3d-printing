  <text x="610" y="330" font-size="16" font-weight="bold">Looking into the notch</text>
  <path d="M649,490 L649,390 L763,390 L769,396 L769,490" fill="none" stroke="#999" stroke-width="6" stroke-linejoin="round"/>
  <path d="M652,490 L652,393 L760,393 L766,399 L766,490 Z" fill="#3b6ea8" opacity="0.6"/>
  <text x="694" y="450" fill="#fff" font-size="12">wedge</text>
  <text x="588" y="482" fill="#666">vent side</text>
  <text x="776" y="482" fill="#666">cluster side</text>
  <text x="570" y="366" fill="#c0392b" font-weight="bold">vent_return = [0, 0] ✓</text>
  <text x="570" y="380" fill="#c0392b" font-size="12">(square)</text>
  <text x="738" y="366" fill="#c0392b" font-weight="bold">cluster_return ?</text>
  <text x="738" y="380" fill="#c0392b" font-size="12">[across, deep]</text>
  <line x1="649" y1="508" x2="769" y2="508" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="649" y1="493" x2="649" y2="515" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="769" y1="493" x2="769" y2="515" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="658" y="530" fill="#c0392b" font-weight="bold">notch_w (mouth) ?</text>
  <text x="662" y="554" fill="#333">↓ toward the driver</text>
  </g>
  <text x="610" y="70" font-size="12" fill="#333">Red = measure in the car</text>
  <text x="610" y="86" font-size="12" fill="#333">(✓ = done, ? = still an estimate).</text>
  <text x="610" y="102" font-size="12" fill="#333">Green = where the charger goes.</text>
  <text x="610" y="128" font-size="12" fill="#333">The model is square to the back face:</text>
  <text x="610" y="144" font-size="12" fill="#333">its "up" runs up that face, so every</text>
  <text x="610" y="160" font-size="12" fill="#333">dimension here tilts with the face.</text>
  <text x="610" y="186" font-size="12" fill="#333">Print part="gauge" (~20 min) and</text>
  <text x="610" y="202" font-size="12" fill="#333">hold both templates in the notch</text>
  <text x="610" y="218" font-size="12" fill="#333">before the full print.</text>
</svg>
