<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- Side view: 3 px/mm, origin (notch floor / back face corner) at (150, 370). x = out toward driver, y = up -->
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="20" y="26" font-size="16" font-weight="bold">Side view (looking from the vent side)</text>

  <g transform="translate(0,45)">
  <!-- dash: back face of notch, floor ledge, hood -->
  <path d="M130,460 L150,460 L150,370 L315,370 L315,460 Z" fill="#d7d7d7"/>
  <path d="M130,460 L130,100 L150,100 L150,370" fill="#d7d7d7"/>
  <rect x="130" y="100" width="20" height="360" fill="#d7d7d7"/>
  <path d="M150,160 L242,160 Q252,160 252,150 L252,100 L150,100 Z" fill="#bdb3a4"/>
  <text x="165" y="130" fill="#5b5040">leather hood</text>
  <text x="160" y="395" fill="#666">floor ledge</text>
  <text x="112" y="300" fill="#666" transform="rotate(-90 112 300)">notch back face</text>

  <!-- bracket: block + upright + ball -->
  <rect x="153" y="166" width="171" height="204" fill="#3b6ea8" rx="6"/>
  <rect x="270" y="-12" width="54" height="382" fill="#3b6ea8" rx="6"/>
  <rect x="153" y="160" width="99" height="6" fill="#8a7b5a"/>
  <line x1="324" y1="20" x2="383" y2="10" stroke="#3b6ea8" stroke-width="30" stroke-linecap="round"/>
  <circle cx="383" cy="10" r="26" fill="#3b6ea8"/>
  <text x="185" y="280" fill="#fff" font-weight="bold">wedge block</text>
  <text x="185" y="298" fill="#fff">VHB on back face</text>
  <text x="276" y="120" fill="#fff" transform="rotate(-90 290 120)">upright</text>
  <text x="160" y="154" fill="#5b5040" font-size="11">EPDM strip</text>

  <!-- notch_h -->
  <line x1="80" y1="370" x2="80" y2="160" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="72" y1="160" x2="150" y2="160" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="72" y1="370" x2="150" y2="370" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="18" y="262" fill="#c0392b" font-weight="bold">notch_h</text>
  <text x="18" y="278" fill="#c0392b">floor → hood</text>
  <text x="18" y="292" fill="#c0392b">underside</text>

  <!-- hood_t -->
  <line x1="226" y1="100" x2="226" y2="160" stroke="#8e6c2e" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="200" y="94" fill="#8e6c2e" font-size="11">hood_t</text>
  <!-- hood_over -->
  <line x1="150" y1="60" x2="252" y2="60" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="252" y1="52" x2="252" y2="100" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="160" y="52" fill="#c0392b" font-weight="bold">hood_over</text>

  <!-- upright_offset -->
  <line x1="150" y1="420" x2="270" y2="420" stroke="#1f7a4d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="270" y1="372" x2="270" y2="428" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <text x="160" y="442" fill="#1f7a4d" font-weight="bold">upright_offset = 40 ("4 cm out")</text>

  <!-- rise -->
  <line x1="440" y1="160" x2="440" y2="10" stroke="#1f7a4d" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="252" y1="160" x2="448" y2="160" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <line x1="409" y1="10" x2="448" y2="10" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <text x="450" y="80" fill="#1f7a4d" font-weight="bold">rise = 50</text>
  <text x="450" y="96" fill="#1f7a4d">("5 cm up" from</text>
  <text x="450" y="110" fill="#1f7a4d">the notch top)</text>
  <text x="450" y="124" fill="#1f7a4d">→ ball centre</text>
  <text x="418" y="40" fill="#333">17 mm ball → driver</text>

  </g>
  <!-- Plan view of the notch, 3 px/mm: mouth 40; vent return [8,8], cluster return [2,2] -->
  <text x="560" y="26" font-size="16" font-weight="bold">Looking down into the notch</text>
  <path d="M639,190 L639,114 L663,90 L753,90 L759,96 L759,190" fill="none" stroke="#999" stroke-width="6" stroke-linejoin="round"/>
  <path d="M642,190 L642,114 L666,93 L750,93 L756,99 L756,190 Z" fill="#3b6ea8" opacity="0.6"/>
  <text x="684" y="150" fill="#fff" font-size="12">block</text>
  <text x="578" y="182" fill="#666">vent side</text>
  <text x="766" y="182" fill="#666">cluster side</text>
  <!-- vent_return: inset (across) and depth (in) -->
  <line x1="639" y1="72" x2="663" y2="72" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="639" y1="66" x2="639" y2="112" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="663" y1="66" x2="663" y2="88" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="614" y1="90" x2="614" y2="114" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="608" y1="90" x2="660" y2="90" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="608" y1="114" x2="636" y2="114" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="540" y="56" fill="#c0392b" font-weight="bold">vent_return = [across, deep]</text>
  <text x="728" y="74" fill="#c0392b" font-weight="bold">cluster_return</text>
  <text x="728" y="88" fill="#c0392b">(same, other side)</text>
  <line x1="639" y1="208" x2="759" y2="208" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="639" y1="193" x2="639" y2="215" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="759" y1="193" x2="759" y2="215" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="648" y="230" fill="#c0392b" font-weight="bold">notch_w (mouth)</text>
  <text x="652" y="258" fill="#333">↓ toward the driver</text>

  <text x="600" y="340" font-size="12" fill="#333">Red = measure these in the car.</text>
  <text x="600" y="358" font-size="12" fill="#333">Green = where you want the charger</text>
  <text x="600" y="374" font-size="12" fill="#333">(defaults are what you asked for).</text>
  <text x="600" y="400" font-size="12" fill="#333">Print part="gauge" (~20 min) and hold</text>
  <text x="600" y="416" font-size="12" fill="#333">it in the notch to check before the</text>
  <text x="600" y="432" font-size="12" fill="#333">full print.</text>
</svg>
