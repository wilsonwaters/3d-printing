  <text x="14.0" y="92.0" fill="#555555" font-size="12"> level through the ball)</text>
  <line x1="338.0" y1="42.0" x2="302.8" y2="112.4" stroke="#333" stroke-width="0.8"/>
  <text x="342.0" y="46.0" fill="#333" font-size="12" font-weight="bold">17 mm ball: stalk ≈ 25°</text>
  <text x="342.0" y="61.0" fill="#333" font-size="12">above level (dashed)</text>
  <line x1="466.0" y1="80.0" x2="409.7" y2="118.1" stroke="#1f7a4d" stroke-width="0.8"/>
  <text x="470.0" y="84.0" fill="#1f7a4d" font-size="12" font-weight="bold">rise = 50</text>
  <text x="470.0" y="99.0" fill="#1f7a4d" font-size="12">up the back face,</text>
  <text x="470.0" y="114.0" fill="#1f7a4d" font-size="12">above the notch top</text>
  <line x1="444.0" y1="318.0" x2="445.0" y2="396.7" stroke="#9a7417" stroke-width="0.8"/>
  <text x="448.0" y="322.0" fill="#9a7417" font-size="12">USB-C groove, all the</text>
  <text x="448.0" y="337.0" fill="#9a7417" font-size="12">way down, pocket over</text>
  <text x="448.0" y="352.0" fill="#9a7417" font-size="12">the ledge's edge</text>
  <line x1="504.0" y1="448.0" x2="488.5" y2="458.3" stroke="#c0392b" stroke-width="0.8"/>
  <text x="508.0" y="452.0" fill="#c0392b" font-size="12" font-weight="bold">floor_drop = 18 ✓</text>
  <text x="508.0" y="467.0" fill="#c0392b" font-size="12">(test fit)</text>
  <line x1="496.0" y1="578.0" x2="475.0" y2="535.9" stroke="#c0392b" stroke-width="0.8"/>
  <text x="500.0" y="582.0" fill="#c0392b" font-size="12" font-weight="bold">floor_depth ≈ 30 ✓</text>
