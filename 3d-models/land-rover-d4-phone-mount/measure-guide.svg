  <text x="368.1" y="478.7" fill="#ffffff" font-size="11">VHB on the back,</text>
  <text x="368.1" y="493.7" fill="#ffffff" font-size="11">dished 2 mm</text>
  <text x="310.4" y="387.6" fill="#ffffff" font-size="11" font-weight="bold">upright_front = 65 (kept)</text>
  <text x="307.5" y="261.6" fill="#ffffff" font-size="11" font-weight="bold">up_d = 25</text>
  <line x1="222.0" y1="186.0" x2="258.9" y2="206.3" stroke="#1f7a4d" stroke-width="0.8"/>
  <text x="218.0" y="190.0" fill="#1f7a4d" font-size="12" font-weight="bold" text-anchor="end">upright_lean = 15°</text>
  <text x="218.0" y="205.0" fill="#1f7a4d" font-size="12" text-anchor="end">bend 24 above</text>
  <text x="218.0" y="220.0" fill="#1f7a4d" font-size="12" text-anchor="end">the notch top</text>
  <line x1="230.0" y1="296.0" x2="281.0" y2="345.8" stroke="#c0392b" stroke-width="0.8"/>
  <text x="226.0" y="300.0" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="end">hood_over = 40 ✓</text>
  <line x1="154.0" y1="400.0" x2="171.3" y2="410.3" stroke="#c0392b" stroke-width="0.8"/>
  <text x="150.0" y="404.0" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="end">hood_t ≈ 20 ?</text>
  <line x1="154.0" y1="448.0" x2="295.7" y2="361.2" stroke="#c0392b" stroke-width="0.8"/>
  <text x="150.0" y="452.0" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="end">hood closes in 15° ✓</text>
  <text x="150.0" y="467.0" fill="#c0392b" font-size="12" text-anchor="end">(the top follows it)</text>
  <line x1="240.0" y1="536.0" x2="262.2" y2="513.1" stroke="#c0392b" stroke-width="0.8"/>
  <text x="236.0" y="540.0" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="end">notch_h = 65 ✓</text>
