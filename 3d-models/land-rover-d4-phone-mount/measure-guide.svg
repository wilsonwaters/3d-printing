<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- Side view drawn to scale: 3 px/mm, origin (notch floor at the back face) at (150, 415).
       x = out toward the driver, y = up. notch_h 65, hood_over 40, ledge 30 deep dropping 6,
       upright 45..65 out, ball 84.7 out / 115 up. -->
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>
  <text x="20" y="18" font-size="16" font-weight="bold">Side view (looking from the vent side)</text>

  <!-- dash: back face, sloping floor ledge, lower panel -->
  <rect x="130" y="150" width="20" height="360" fill="#d7d7d7"/>
  <path d="M150,415 L240,433 L240,510 L150,510 Z" fill="#d7d7d7"/>
  <text x="160" y="470" fill="#666">floor ledge</text>
  <text x="160" y="486" fill="#666">(slopes down)</text>
  <text x="124" y="330" fill="#666" font-size="12" transform="rotate(-90 124 330)">notch back face</text>

  <!-- hood: underside at 65 (y=220), lip 40 out (x=270), ~20 thick -->
  <path d="M150,220 L260,220 Q270,220 270,210 L270,160 L150,160 Z" fill="#bdb3a4"/>
  <text x="170" y="196" fill="#5b5040">leather hood</text>

  <!-- bracket: wedge + upright + neck + ball -->
  <path d="M153,415 L240,433 L345,226 L153,226 Z" fill="#3b6ea8"/>
  <rect x="285" y="48" width="60" height="180" rx="8" fill="#3b6ea8"/>
  <rect x="153" y="220" width="117" height="6" fill="#8a7b5a"/>
  <line x1="345" y1="75" x2="404" y2="70" stroke="#3b6ea8" stroke-width="30" stroke-linecap="round"/>
  <circle cx="404" cy="70" r="26" fill="#3b6ea8"/>
  <text x="170" y="320" fill="#fff" font-weight="bold">wedge</text>
  <text x="170" y="338" fill="#fff">VHB on back face</text>
  <text x="300" y="165" fill="#fff" transform="rotate(-90 314 150)">upright</text>
  <text x="160" y="214" fill="#5b5040" font-size="11">EPDM strip</text>

  <!-- notch_h -->
  <line x1="80" y1="415" x2="80" y2="220" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="72" y1="220" x2="150" y2="220" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="72" y1="415" x2="150" y2="415" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="14" y="300" fill="#c0392b" font-weight="bold">notch_h</text>
  <text x="14" y="316" fill="#c0392b">= 65 ✓</text>

  <!-- hood_over -->
  <line x1="150" y1="138" x2="270" y2="138" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="270" y1="130" x2="270" y2="160" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="160" y="130" fill="#c0392b" font-weight="bold">hood_over = 40 ✓</text>

  <!-- floor_depth / floor_drop -->
  <line x1="150" y1="448" x2="240" y2="448" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="240" y1="436" x2="240" y2="456" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="152" y="505" fill="#c0392b" font-weight="bold" font-size="12">floor_depth ≈ 30 ✓</text>
  <line x1="262" y1="415" x2="262" y2="433" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="150" y1="415" x2="270" y2="415" stroke="#c0392b" stroke-dasharray="2 3"/>
  <line x1="240" y1="433" x2="270" y2="433" stroke="#c0392b" stroke-dasharray="2 3"/>
  <text x="272" y="428" fill="#c0392b" font-weight="bold">floor_drop ?</text>
  <text x="272" y="444" fill="#c0392b" font-size="12">how much lower the ledge</text>
  <text x="272" y="458" fill="#c0392b" font-size="12">is 30 mm out (guess: 6)</text>

  <!-- upright_offset -->
  <line x1="150" y1="33" x2="285" y2="33" stroke="#1f7a4d" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <line x1="285" y1="27" x2="285" y2="48" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <line x1="150" y1="27" x2="150" y2="150" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <text x="156" y="50" fill="#1f7a4d" font-weight="bold" font-size="12">upright_offset = 45</text>

  <!-- rise -->
  <line x1="470" y1="220" x2="470" y2="70" stroke="#1f7a4d" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <line x1="270" y1="220" x2="478" y2="220" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <line x1="430" y1="70" x2="478" y2="70" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <text x="480" y="130" fill="#1f7a4d" font-weight="bold">rise = 50</text>
  <text x="480" y="146" fill="#1f7a4d">5 cm higher than a</text>
  <text x="480" y="160" fill="#1f7a4d">charger clipped into</text>
  <text x="480" y="174" fill="#1f7a4d">the notch top</text>
  <text x="440" y="100" fill="#333">17 mm ball → driver</text>

  <!-- Plan view of the notch, 3 px/mm: mouth 40; vent return [8,8], cluster return [2,2] -->
  <text x="600" y="250" font-size="16" font-weight="bold">Looking down into the notch</text>
  <path d="M639,410 L639,334 L663,310 L753,310 L759,316 L759,410" fill="none" stroke="#999" stroke-width="6" stroke-linejoin="round"/>
  <path d="M642,410 L642,334 L666,313 L750,313 L756,319 L756,410 Z" fill="#3b6ea8" opacity="0.6"/>
  <text x="684" y="370" fill="#fff" font-size="12">wedge</text>
  <text x="578" y="402" fill="#666">vent side</text>
  <text x="766" y="402" fill="#666">cluster side</text>
  <line x1="639" y1="292" x2="663" y2="292" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="639" y1="286" x2="639" y2="332" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="663" y1="286" x2="663" y2="308" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="614" y1="310" x2="614" y2="334" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="608" y1="310" x2="660" y2="310" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="608" y1="334" x2="636" y2="334" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="560" y="276" fill="#c0392b" font-weight="bold">vent_return = [across, deep] ?</text>
  <text x="728" y="294" fill="#c0392b" font-weight="bold">cluster_return ?</text>
  <text x="728" y="308" fill="#c0392b">(same, other side)</text>
  <line x1="639" y1="428" x2="759" y2="428" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="639" y1="413" x2="639" y2="435" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="759" y1="413" x2="759" y2="435" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="648" y="450" fill="#c0392b" font-weight="bold">notch_w (mouth) ?</text>
  <text x="652" y="474" fill="#333">↓ toward the driver</text>

  <text x="600" y="60" font-size="12" fill="#333">Red = measure in the car</text>
  <text x="600" y="76" font-size="12" fill="#333">(✓ = done, ? = still an estimate).</text>
  <text x="600" y="92" font-size="12" fill="#333">Green = where the charger goes.</text>
  <text x="600" y="118" font-size="12" fill="#333">Print part="gauge" (~20 min) and hold</text>
  <text x="600" y="134" font-size="12" fill="#333">both templates in the notch before</text>
  <text x="600" y="150" font-size="12" fill="#333">the full print.</text>
</svg>
