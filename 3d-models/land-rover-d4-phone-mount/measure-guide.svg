<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- Side view drawn to scale: 3 px/mm, origin (notch floor at the back face) at (150, 450).
       x = out toward the driver, y = up. notch_h 65, hood_over 40, ledge 30 deep dropping 16,
       upright 40..65 out, knee 24 above the hood underside, lean 15deg, head square to a
       stalk 20deg below level, ball 81.4 out / 115 up. -->
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="8" y="22" font-size="14" font-weight="bold">Side view (from the vent side)</text>

  <!-- dash: flat back face, steep floor ledge, lower panel -->
  <rect x="100" y="255" width="50" height="195" fill="#d7d7d7"/>
  <path d="M150,450 L240,498 L240,545 L100,545 L100,450 Z" fill="#d7d7d7"/>
  <text x="112" y="400" fill="#666" font-size="12" transform="rotate(-90 112 400)">back face (flat)</text>
  <text x="110" y="530" fill="#666" font-size="12">floor ledge (slopes down)</text>

  <!-- hood: underside at 65 (y=255), lip 40 out (x=270), ~20 thick (top y=195) -->
  <path d="M100,255 L260,255 Q270,255 270,245 L270,195 L100,195 Z" fill="#bdb3a4"/>
  <text x="160" y="214" fill="#5b5040">leather hood</text>

  <!-- bracket: wedge + upright (vertical, then leaning 15deg) + head square to the stalk -->
  <path d="M150,450 L240,498 L345,261 L150,261 Z" fill="#3b6ea8"/>
  <path d="M270,264 L345,264 L345,178 L327.5,112.7 L349,53.5 L326.5,45.2 L251.8,119.9 L270,188 Z" fill="#3b6ea8"/>
  <rect x="152" y="255" width="116" height="6" fill="#8a7b5a"/>
  <line x1="337.7" y1="84.5" x2="394.1" y2="105" stroke="#3b6ea8" stroke-width="30" stroke-linecap="round"/>
  <circle cx="394.1" cy="105" r="25.5" fill="#3b6ea8"/>
  <!-- W116 charger (ghost), square to the stalk -->
  <rect x="-25.5" y="-99" width="51" height="198" rx="10" fill="#222" opacity="0.25" transform="translate(426.6,116.8) rotate(20)"/>
  <!-- cable groove down the sloping front, then straight down clear of the ledge edge -->
  <path d="M342,266 L254.3,465.7 L250.5,520" fill="none" stroke="#f2c14e" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="262" y="432" fill="#9a7417" font-size="12">USB-C groove</text>
  <text x="178" y="360" fill="#fff" font-weight="bold">wedge</text>
  <text x="178" y="378" fill="#fff">VHB on the flat back</text>
  <text x="156" y="274" fill="#fff" font-size="10">EPDM strip on top</text>

  <!-- upright_front / up_d (white, on the part) -->
  <line x1="152" y1="298" x2="336" y2="298" stroke="#fff" stroke-width="1.5" marker-start="url(#w)" marker-end="url(#w)"/>
  <line x1="345" y1="266" x2="345" y2="304" stroke="#fff" stroke-dasharray="2 2"/>
  <text x="160" y="316" fill="#fff" font-size="12" font-weight="bold">upright_front = 65 (kept)</text>
  <line x1="272" y1="232" x2="343" y2="232" stroke="#fff" stroke-width="1.5" marker-start="url(#w)" marker-end="url(#w)"/>
  <text x="280" y="226" fill="#fff" font-size="12" font-weight="bold">up_d = 25</text>

  <!-- back_sag -->
  <text x="8" y="470" fill="#c0392b" font-weight="bold" font-size="12">back_sag = 0 ✓</text>
  <text x="8" y="484" fill="#c0392b" font-size="11">(flat, test fit)</text>

  <!-- notch_h and hood_t, stacked on the left -->
  <line x1="64" y1="450" x2="64" y2="255" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="58" y1="255" x2="100" y2="255" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="58" y1="450" x2="100" y2="450" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="8" y="345" fill="#c0392b" font-weight="bold">notch_h</text>
  <text x="8" y="361" fill="#c0392b">= 65 ✓</text>
  <line x1="64" y1="253" x2="64" y2="195" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="58" y1="195" x2="100" y2="195" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="8" y="222" fill="#c0392b" font-weight="bold" font-size="12">hood_t</text>
  <text x="8" y="236" fill="#c0392b" font-size="12">≈ 20 ?</text>

  <!-- hood_over -->
  <line x1="150" y1="244" x2="268" y2="244" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="160" y="236" fill="#c0392b" font-weight="bold" font-size="12">hood_over = 40 ✓</text>

  <!-- floor_depth / floor_drop -->
  <line x1="150" y1="512" x2="240" y2="512" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="240" y1="500" x2="240" y2="518" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="112" y="552" fill="#c0392b" font-weight="bold" font-size="12">floor_depth ≈ 30 ✓</text>
  <line x1="276" y1="450" x2="276" y2="498" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="150" y1="450" x2="284" y2="450" stroke="#c0392b" stroke-dasharray="2 3"/>
  <line x1="240" y1="498" x2="284" y2="498" stroke="#c0392b" stroke-dasharray="2 3"/>
  <text x="286" y="470" fill="#c0392b" font-weight="bold">floor_drop = 16 ✓</text>
  <text x="286" y="486" fill="#c0392b" font-size="12">(test fit)</text>

  <!-- upright_lean at the knee (knee centre 52.5 out, 89 up) -->
  <line x1="307.5" y1="183" x2="307.5" y2="110" stroke="#1f7a4d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M307.5,137 A46,46 0 0 0 295.6,138.6" fill="none" stroke="#1f7a4d" stroke-width="2"/>
  <text x="110" y="136" fill="#1f7a4d" font-weight="bold" font-size="12">upright_lean = 15°</text>
  <text x="110" y="150" fill="#1f7a4d" font-size="11">bend 24 above the</text>
  <text x="110" y="163" fill="#1f7a4d" font-size="11">hood underside</text>

  <!-- rise -->
  <line x1="500" y1="255" x2="500" y2="105" stroke="#1f7a4d" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <line x1="272" y1="255" x2="508" y2="255" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <line x1="420" y1="105" x2="508" y2="105" stroke="#1f7a4d" stroke-dasharray="3 3"/>
  <text x="508" y="160" fill="#1f7a4d" font-weight="bold">rise = 50</text>
  <text x="508" y="176" fill="#1f7a4d" font-size="12">5 cm above a</text>
  <text x="508" y="190" fill="#1f7a4d" font-size="12">notch-clipped</text>
  <text x="508" y="204" fill="#1f7a4d" font-size="12">charger</text>
  <text x="215" y="42" fill="#333" font-size="12">17 mm ball,</text>
  <text x="215" y="56" fill="#333" font-size="12">stalk 20° down</text>

  <!-- Plan view of the notch, 3 px/mm: mouth 40; vent side square, cluster return [2,2] -->
  <text x="600" y="250" font-size="16" font-weight="bold">Looking down into the notch</text>
  <path d="M639,410 L639,310 L753,310 L759,316 L759,410" fill="none" stroke="#999" stroke-width="6" stroke-linejoin="round"/>
  <path d="M642,410 L642,313 L750,313 L756,319 L756,410 Z" fill="#3b6ea8" opacity="0.6"/>
  <text x="684" y="370" fill="#fff" font-size="12">wedge</text>
  <text x="578" y="402" fill="#666">vent side</text>
  <text x="766" y="402" fill="#666">cluster side</text>
  <text x="560" y="286" fill="#c0392b" font-weight="bold">vent_return = [0, 0] ✓</text>
  <text x="560" y="300" fill="#c0392b" font-size="12">(square)</text>
  <text x="728" y="286" fill="#c0392b" font-weight="bold">cluster_return ?</text>
  <text x="728" y="300" fill="#c0392b" font-size="12">[across, deep]</text>
  <line x1="639" y1="428" x2="759" y2="428" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="639" y1="413" x2="639" y2="435" stroke="#c0392b" stroke-dasharray="3 3"/>
  <line x1="759" y1="413" x2="759" y2="435" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="648" y="450" fill="#c0392b" font-weight="bold">notch_w (mouth) ?</text>
  <text x="652" y="474" fill="#333">↓ toward the driver</text>

  <text x="640" y="60" font-size="12" fill="#333">Red = measure in the car</text>
  <text x="640" y="76" font-size="12" fill="#333">(✓ = done, ? = still an estimate).</text>
  <text x="640" y="92" font-size="12" fill="#333">Green = where the charger goes.</text>
  <text x="640" y="118" font-size="12" fill="#333">Print part="gauge" (~20 min) and</text>
  <text x="640" y="134" font-size="12" fill="#333">hold both templates in the notch</text>
  <text x="640" y="150" font-size="12" fill="#333">before the full print.</text>
</svg>
